<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" fill="none">
  <defs>
    <linearGradient id="bd-s-grad" x1="16" y1="12" x2="64" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e7c70" />
      <stop offset="60%" stop-color="#0d6e63" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="bd-s-fold" x1="48" y1="12" x2="64" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="bd-s-seal" x1="42" y1="44" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <style>
    .brand-title-stacked {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-weight: 800;
      font-size: 24px;
      letter-spacing: -0.03em;
      text-anchor: middle;
    }
    .brand-sub-stacked {
      font-family: 'Anek Bangla', 'Hind Siliguri', system-ui, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #475569;
      text-anchor: middle;
      letter-spacing: 0.02em;
    }
    .text-bangla-s { fill: #0f172a; }
    .text-doc-s { fill: #0d6e63; }

    @media (prefers-color-scheme: dark) {
      .text-bangla-s { fill: #f8fafc; }
      .text-doc-s { fill: #2dd4bf; }
      .brand-sub-stacked { fill: #94a3b8; }
    }
  </style>

  <!-- Centered Icon Mark (64x64 at x=68, y=12) -->
  <g transform="translate(68, 12)">
    <path fill="url(#bd-s-grad)" fill-rule="evenodd" clip-rule="evenodd" d="
      M 9 6 C 6.791 6 5 7.791 5 10 L 5 54 C 5 56.209 6.791 58 9 58 L 55 58 C 57.209 58 59 56.209 59 54 L 59 22 L 43 6 L 9 6 Z
      M 13 13 L 38 13 L 38 21 C 38 22.657 39.343 24 41 24 L 51 24 L 51 50 L 13 50 L 13 13 Z
      M 20 20 L 33 20 L 33 24 L 20 24 Z
      M 20 29 L 44 29 L 44 33 L 20 33 Z
      M 20 38 L 35 38 L 35 42 L 20 42 Z
    " />
    <path fill="url(#bd-s-fold)" d="
      M 43 6 L 43 19 C 43 21.209 44.791 23 47 23 L 59 23 Z
    " />
    <circle cx="41.5" cy="40.5" r="4" fill="url(#bd-s-seal)" />
  </g>

  <!-- Centered Typography -->
  <text x="100" y="112" class="brand-title-stacked">
    <tspan class="text-bangla-s">Bangla</tspan><tspan class="text-doc-s">Doc</tspan>
  </text>
  <text x="100" y="132" class="brand-sub-stacked">
    সহজ আইনি ও প্রশাসনিক কাগজপত্র
